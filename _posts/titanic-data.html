---
layout: base
title: Titanic Survival Predictor
description: Predict passenger survival probability using a logistic regression model.
permalink: /titanic/
courses: { csp: {week: 1} }
type: collab
---

<div id="titanic-app">
  <h1>Titanic Survival Predictor</h1>
  <p>Enter passenger details to estimate survival probability.</p>

  <div class="t-grid">
    <div class="t-field">
      <label>Name</label>
      <input id="name" type="text" value="John Doe" />
    </div>
    <div class="t-field">
      <label>Passenger Class</label>
      <select id="pclass">
        <option value="1">1st Class</option>
        <option value="2">2nd Class</option>
        <option value="3" selected>3rd Class</option>
      </select>
    </div>
    <div class="t-field">
      <label>Sex</label>
      <select id="sex">
        <option value="male" selected>Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="t-field">
      <label>Age</label>
      <input id="age" type="number" min="0" max="100" value="30" />
    </div>
    <div class="t-field">
      <label>Siblings / Spouses Aboard</label>
      <input id="sibsp" type="number" min="0" value="0" />
    </div>
    <div class="t-field">
      <label>Parents / Children Aboard</label>
      <input id="parch" type="number" min="0" value="0" />
    </div>
    <div class="t-field">
      <label>Fare Paid ($)</label>
      <input id="fare" type="number" min="0" step="0.01" value="14.50" />
    </div>
    <div class="t-field">
      <label>Port of Embarkation</label>
      <select id="embarked">
        <option value="C">Cherbourg (C)</option>
        <option value="Q">Queenstown (Q)</option>
        <option value="S" selected>Southampton (S)</option>
      </select>
    </div>
    <div class="t-field">
      <label>Traveling Alone</label>
      <select id="alone">
        <option value="true" selected>Yes</option>
        <option value="false">No</option>
      </select>
    </div>
  </div>

  <button id="predict-btn" onclick="predictSurvival()">Predict Survival</button>

  <p id="t-error" style="color:red; display:none;"></p>

  <div id="t-result" style="display:none; margin-top:20px;">
    <p id="t-verdict" style="font-weight:bold; font-size:18px;"></p>
    <label>Survival</label>
    <div class="track"><div class="fill green" id="survive-bar"></div></div>
    <small id="survive-pct"></small>
    <br><br>
    <label>Death</label>
    <div class="track"><div class="fill red" id="die-bar"></div></div>
    <small id="die-pct"></small>
  </div>
</div>

<style>
  #titanic-app {
    max-width: 600px;
    margin: 40px auto;
    font-family: Georgia, serif;
  }
  .t-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 20px;
    margin: 24px 0;
  }
  .t-field { display: flex; flex-direction: column; gap: 4px; }
  .t-field label { font-size: 12px; font-weight: bold; text-transform: uppercase; }
  .t-field input, .t-field select {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 3px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #333; }
  button:disabled { background: #999; cursor: not-allowed; }
  .track { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 4px; }
  .fill { height: 100%; border-radius: 5px; width: 0%; transition: width 0.4s ease; }
  .green { background: #16a34a; }
  .red { background: #dc2626; }
  @media (max-width: 500px) { .t-grid { grid-template-columns: 1fr; } }
</style>

<script>
  async function predictSurvival() {
    const btn = document.getElementById('predict-btn');
    const errorEl = document.getElementById('t-error');
    const resultEl = document.getElementById('t-result');

    errorEl.style.display = 'none';
    resultEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Predicting...';

    const passenger = {
      name:     [document.getElementById('name').value || 'Passenger'],
      pclass:   [parseInt(document.getElementById('pclass').value)],
      sex:      [document.getElementById('sex').value],
      age:      [parseFloat(document.getElementById('age').value)],
      sibsp:    [parseInt(document.getElementById('sibsp').value)],
      parch:    [parseInt(document.getElementById('parch').value)],
      fare:     [parseFloat(document.getElementById('fare').value)],
      embarked: [document.getElementById('embarked').value],
      alone:    [document.getElementById('alone').value === 'true'],
    };

    try {
      const res = await fetch('http://localhost:8001/api/titanic/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(passenger),
      });

      if (!res.ok) throw new Error(`Server error: ${res.status}`);
      const data = await res.json();

      const survivePct = Math.round(data.survive * 100);
      const diePct = Math.round(data.die * 100);
      const survived = survivePct >= 50;

      document.getElementById('survive-pct').textContent = survivePct + '%';
      document.getElementById('die-pct').textContent = diePct + '%';
      document.getElementById('survive-bar').style.width = survivePct + '%';
      document.getElementById('die-bar').style.width = diePct + '%';

      const verdict = document.getElementById('t-verdict');
      verdict.textContent = survived ? '✓ Likely Survived' : '✗ Likely Did Not Survive';
      verdict.style.color = survived ? '#16a34a' : '#dc2626';

      resultEl.style.display = 'block';

    } catch (e) {
      errorEl.textContent = 'Error: ' + e.message;
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Predict Survival';
    }
  }
</script>
